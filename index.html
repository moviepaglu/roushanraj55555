<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Admin Panel</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, Arial, sans-serif; }
  body { background: linear-gradient(145deg, #0f172a, #1e293b); min-height:100vh; padding:20px; color:#e2e8f0; }
  .container { max-width: 950px; margin:0 auto; }
  .header { text-align:center; margin-bottom:25px; padding:22px; background:rgba(30,41,59,0.7); border-radius:20px; border:1px solid #334155; }
  h1 { font-size:28px; background:linear-gradient(135deg,#f59e0b,#ef4444); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .badge { display:inline-block; background:#ef4444; color:#fff; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; margin-top:6px; letter-spacing:1px; }
  .sub { color:#94a3b8; font-size:13px; margin-top:6px; }

  .card { background:rgba(30,41,59,0.8); border-radius:20px; padding:24px; margin-bottom:20px; border:1px solid #334155; box-shadow:0 10px 30px rgba(0,0,0,0.3); }
  .card h2 { font-size:18px; margin-bottom:18px; color:#f1f5f9; border-left:4px solid #f59e0b; padding-left:12px; }

  label { display:block; font-size:13px; color:#cbd5e1; margin-bottom:6px; font-weight:600; margin-top:14px; }
  label:first-of-type { margin-top:0; }

  input[type="text"], textarea, select {
    width:100%; padding:13px 16px; border-radius:12px; border:2px solid #334155;
    background:#0f172a; color:#fff; font-size:14px; outline:none; transition:0.2s; font-family:inherit;
  }
  textarea { resize:vertical; min-height:80px; }
  select { cursor:pointer; }
  input:focus, textarea:focus, select:focus { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,0.2); }
  input::placeholder, textarea::placeholder { color:#64748b; }

  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .poster-upload { display:flex; gap:16px; align-items:flex-start; margin-top:6px; }
  .poster-preview {
    width:110px; height:150px; border-radius:12px; background:#0f172a;
    border:2px dashed #334155; display:flex; align-items:center; justify-content:center;
    color:#64748b; font-size:11px; text-align:center; flex-shrink:0; overflow:hidden;
  }
  .poster-preview img { width:100%; height:100%; object-fit:cover; }
  .poster-controls { flex:1; }
  .file-btn {
    display:inline-block; padding:10px 18px; background:#334155; color:#f1f5f9;
    border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; transition:0.2s; border:2px solid transparent;
  }
  .file-btn:hover { background:#475569; border-color:#f59e0b; }
  #posterInput { display:none; }
  .file-hint { font-size:11px; color:#64748b; margin-top:8px; }

  .btn {
    width:100%; padding:15px; border:none; border-radius:12px; font-size:15px; font-weight:700;
    cursor:pointer; margin-top:20px; transition:0.2s; color:#fff;
    background:linear-gradient(135deg,#f59e0b,#ef4444);
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(245,158,11,0.4); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  .status-msg { margin-top:12px; padding:10px 14px; border-radius:10px; font-size:13px; display:none; }
  .status-success { background:#064e3b; color:#6ee7b7; display:block; }
  .status-error { background:#7f1d1d; color:#fca5a5; display:block; }

  .movie-list { display:flex; flex-direction:column; gap:12px; }
  .movie-item {
    background:#0f172a; border:1px solid #334155; border-radius:14px; padding:14px;
    display:flex; gap:14px; align-items:flex-start; transition:0.2s;
  }
  .movie-item:hover { border-color:#f59e0b; }
  .item-poster { width:65px; height:90px; border-radius:8px; object-fit:cover; background:#1e293b; flex-shrink:0; border:1px solid #334155; }
  .item-info { flex:1; min-width:0; }
  .item-name { font-weight:700; color:#f1f5f9; font-size:15px; margin-bottom:6px; word-break:break-word; }
  .item-badges { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .mini-badge { font-size:10px; padding:3px 9px; border-radius:20px; font-weight:700; }
  .badge-lang { background:#1e40af; color:#bfdbfe; }
  .badge-quality { background:#065f46; color:#6ee7b7; }
  .item-desc { font-size:12px; color:#94a3b8; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .btn-delete {
    background:#ef4444; color:#fff; border:none; padding:8px 14px; border-radius:8px;
    font-weight:700; cursor:pointer; font-size:12px; transition:0.2s; flex-shrink:0;
  }
  .btn-delete:hover { background:#dc2626; }

  .empty, .loading { text-align:center; padding:30px 20px; color:#64748b; font-size:14px; }
  .count-badge { background:#334155; color:#f1f5f9; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; }

  @media(max-width:600px) { .row-2 { grid-template-columns:1fr; } h1 { font-size:22px; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎬 Admin Panel</h1>
    <span class="badge">ADMIN ONLY</span>
    <p class="sub">Movie add karo → User ko turant dikh jayegi</p>
  </div>

  <div class="card">
    <h2>➕ Nai Movie Add Karo</h2>

    <label>🎥 Movie Ka Naam</label>
    <input type="text" id="movieName" placeholder="Example: Avengers Endgame 2019">

    <label>🖼️ Movie Poster (Main Photo)</label>
    <div class="poster-upload">
      <div class="poster-preview" id="posterPreview"><span>No Image</span></div>
      <div class="poster-controls">
        <label for="posterInput" class="file-btn">📁 Choose Poster</label>
        <input type="file" id="posterInput" accept="image/*">
        <div class="file-hint" id="posterFileName">JPG, PNG — auto compress hoga</div>
      </div>
    </div>

    <label>🔗 Video Ka Direct Link (MP4)</label>
    <input type="text" id="movieLink" placeholder="https://example.com/movie.mp4">

    <label>📝 Description</label>
    <textarea id="movieDesc" placeholder="Movie ki short description likho..."></textarea>

    <div class="row-2">
      <div>
        <label>🌐 Language</label>
        <select id="movieLang">
          <option value="Hindi">Hindi</option>
          <option value="English">English</option>
          <option value="Tamil">Tamil</option>
          <option value="Telugu">Telugu</option>
          <option value="Punjabi">Punjabi</option>
          <option value="Bengali">Bengali</option>
          <option value="Marathi">Marathi</option>
          <option value="Korean">Korean</option>
          <option value="Japanese">Japanese</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label>🎞️ Quality</label>
        <select id="movieQuality">
          <option value="480p">480p</option>
          <option value="720p">720p</option>
          <option value="1080p" selected>1080p</option>
          <option value="4K">4K</option>
          <option value="HD">HD</option>
        </select>
      </div>
    </div>

    <button class="btn" id="addBtn" onclick="addMovie()">➕ ADD MOVIE</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="card">
    <h2>📋 Sabhi Movies <span class="count-badge" id="countBadge">0</span></h2>
    <div class="movie-list" id="movieList"><div class="loading">⏳ Loading...</div></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, remove }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAoBHL1Fm6jhzlSpC_FejQ8xfs1k7OMbiU",
    authDomain: "movie-972ad.firebaseapp.com",
    databaseURL: "https://movie-972ad-default-rtdb.firebaseio.com",
    projectId: "movie-972ad",
    storageBucket: "movie-972ad.firebasestorage.app",
    messagingSenderId: "531283834303",
    appId: "1:531283834303:web:a7ce333d6dbe6445a9dd0a",
    measurementId: "G-MX2P3V39WM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const moviesRef = ref(db, 'movies');

  let posterBase64 = null;

  // ---------- Image compress → base64 ----------
  function compressImage(file, maxW = 300, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('posterInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      posterBase64 = await compressImage(file);
      document.getElementById('posterPreview').innerHTML = `<img src="${posterBase64}" alt="preview">`;
      document.getElementById('posterFileName').textContent = file.name + ' ✅ ready';
    } catch (err) {
      alert('Image load fail: ' + err.message);
    }
  });

  // ---------- Add Movie ----------
  window.addMovie = async function() {
    const name = document.getElementById('movieName').value.trim();
    const link = document.getElementById('movieLink').value.trim();
    const desc = document.getElementById('movieDesc').value.trim();
    const lang = document.getElementById('movieLang').value;
    const quality = document.getElementById('movieQuality').value;
    const btn = document.getElementById('addBtn');

    if (!name) return showStatus('❌ Movie ka naam likho!', 'error');
    if (!link) return showStatus('❌ Video link daalo!', 'error');
    if (!link.startsWith('http')) return showStatus('❌ Link http/https se start hona chahiye!', 'error');
    if (!posterBase64) return showStatus('❌ Poster select karo!', 'error');
    if (!desc) return showStatus('❌ Description likho!', 'error');

    btn.disabled = true;
    btn.textContent = '⏳ Adding...';

    try {
      const newRef = push(moviesRef);
      await set(newRef, {
        name, link, desc, lang, quality,
        poster: posterBase64,
        time: Date.now()
      });
      resetForm();
      showStatus('✅ Movie add ho gayi!', 'success');
    } catch (err) {
      console.error(err);
      showStatus('❌ Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '➕ ADD MOVIE';
    }
  };

  function resetForm() {
    document.getElementById('movieName').value = '';
    document.getElementById('movieLink').value = '';
    document.getElementById('movieDesc').value = '';
    document.getElementById('movieLang').value = 'Hindi';
    document.getElementById('movieQuality').value = '1080p';
    document.getElementById('posterInput').value = '';
    document.getElementById('posterFileName').textContent = 'JPG, PNG — auto compress hoga';
    document.getElementById('posterPreview').innerHTML = '<span>No Image</span>';
    posterBase64 = null;
  }

  // ---------- Delete ----------
  window.deleteMovie = async function(id, name) {
    if (!confirm(`"${name}" delete karni hai?`)) return;
    try {
      await remove(ref(db, 'movies/' + id));
    } catch (err) {
      alert('Delete fail: ' + err.message);
    }
  };

  // ---------- Live List ----------
  onValue(moviesRef, (snapshot) => {
    const listDiv = document.getElementById('movieList');
    const data = snapshot.val();
    const countBadge = document.getElementById('countBadge');

    if (!data) {
      listDiv.innerHTML = '<div class="empty">🎞️ Abhi koi movie nahi hai. Upar add karo!</div>';
      countBadge.textContent = '0';
      return;
    }

    const movies = Object.entries(data).map(([id, val]) => ({ id, ...val }));
    movies.sort((a, b) => b.time - a.time);
    countBadge.textContent = movies.length;

    listDiv.innerHTML = '';
    movies.forEach(m => {
      const div = document.createElement('div');
      div.className = 'movie-item';
      const posterImg = m.poster
        ? `<img class="item-poster" src="${m.poster}" alt="">`
        : `<div class="item-poster" style="display:flex;align-items:center;justify-content:center;color:#64748b;font-size:20px;">🎬</div>`;

      div.innerHTML = `
        ${posterImg}
        <div class="item-info">
          <div class="item-name">🎬 ${escapeHtml(m.name)}</div>
          <div class="item-badges">
            <span class="mini-badge badge-lang">🌐 ${escapeHtml(m.lang || 'N/A')}</span>
            <span class="mini-badge badge-quality">🎞️ ${escapeHtml(m.quality || 'N/A')}</span>
          </div>
          <div class="item-desc">${escapeHtml(m.desc || 'No description')}</div>
        </div>
        <button class="btn-delete" onclick="deleteMovie('${m.id}', '${escapeHtml(m.name).replace(/'/g, "\\'")}')">🗑️</button>
      `;
      listDiv.appendChild(div);
    });
  });

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg status-' + type;
    setTimeout(() => { el.className = 'status-msg'; }, 3500);
  }
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
